# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.php"
      instructions: |
        **Опциональные правила для Inertia + vue + Laravel:**
        Проверь, что подключение .vue шаблонов в контроллерах соответствовует следующему примеру: return inertia('Project/Index', []);. Убедись, что в папке Project действительно существует файл Index.vue.
        Убедись, что контроллер не пробрасывает из модели все свойства/поля, а только те, которые явно необходимы в соответствующем .vue файле.
        Убедись, что контроллеры передают в .vue файлы те пропсы, которые действительно ожидаются в .vue файле. Например, в контроллере:
            return inertia('Project/Index', ['project'=>$project]);. Видим, что передается пропс project
            Далее в файле Index.vue в props = defineProps() должен быть объявлен пропс project. Вот так: props = defineProps({project: Object}). По возможности, старайся проверять типы данных.

        Убедись, что структура директории с файлами .vue для контроллера соответствует следующим принципам CRUD, когда это необходимо:
            1) Индексная страница / список элементов - это всегда {Model}/Index.vue. Например, Project/Index.vue.
            2) Форма создания элемента - это всегда {Model}/Create.vue. Например, Project/Create.vue.
            3) Страница / Просмотр одного элемента - это всегда {Model}/Show.vue. Например, Project/Show.vue.
            4) Форма редактирования элемента - это всегда {Model}/Edit.vue. Например, Proejct/Edit.vue.
            5) Любые другие компоненты, выходящие за рамки CRUD операций, должны также соответствовать примеру {Model}/{Feature.vue}. Например, Project/Filter.vue.
            
        **Общие правила как для Laravel, так и для php кода в целом**
        Проверь PHP код на наличие отладочных конструкций (dd, var_dump, print_r) и укажи на любые найденные. 
        Убедись, что типы возвращаемых значений функций соответствуют объявленным типам. Проверьте, что свойства класса или переменные скрипта объявлены в начале блока.
        Проверь, что функции и методы начинаются с глаголов, когда это необходимо. Например, getLeadsCount - правильно, а leadsCount - неправильно.
        Проверь, что функции для получения булева значения (true/false) начинаются с соответствующих глаголов, когда это необходимо. Например isEditable, hasChildren.
        Убедись, что для свойств в контроллере/модели нет излишних get и set методов. Например, getVar() и setVar() для установки и получения значения - это излишние методы и их не должно быть в модели / контроллере.
        Убедись, что контроллеры Laravel принимают Dependency Injection тогда, когда это необходимо. Например, при получении параметра из маршрута (route).
        Убедись, что в контроллерах Laravel валидация входных данных (Request) выносится в Form Request, а не пишется напрямую в методе контроллера.
        Убедись, что все новые функции содержат комментарий с описанием, описывающий выполнение данной функции, какие параметры ожидает и какой результат возвращает. 
        

    - path: "**/*.js"
      instructions: |
        Проверь JavaScript код на наличие отладочных конструкций (console.log и т.п.). Убедись, что отсутствует закомментированный код.
        Проверь, что функции и методы начинаются с глаголов. Например, getLeadsCount - правильно, а leadsCount - неправильно.
        Проверь, что функции для получения булева значения (true/false) начинаются с соответствующих глаголов: is — является; has — владеет/содержит. Например isEditable, hasChildren

    - path: "**/*.vue"
      instructions: |
        Убедись, что .vue файлы имеют следующую структуру: <template>, <script setup>, <style>, в указанном порядке. Убедись, что в тегах script отсутствуют отладочные конструкции (console.log) и закомментированный код.
        Убедись, что в секции <script setup></script> отсутствуют неиспользуемые инструменты, такие как: 
            1) Подключенные компоненты .vue
            2) Переменные и функции, в том числе computed свойства.
    
        
    - path: "routes/*.php"
      instructions: |
        **Проверка маршрутов Laravel:**

        1.  **Изучи файл маршрутов:**  Открой файл, содержащий роуты (например, `routes/web.php` или `routes/api.php`).
        2.  **Для каждого маршрута:**
            *   Проверь, что указанный контроллер существует.
            *   Проверь, что метод контроллера, на который ссылается маршрут, существует.
            *   Убедись, что HTTP-метод маршрута (GET, POST, PUT, DELETE, PATCH) соответствует методу в контроллере.
            *   Убедись, что контроллер соответствует принципу CRUD.
            *   Проверь, что параметры маршрута (например, `{id}`) правильно передаются в метод контроллера.
        3.  **Проверь отсутствие неиспользуемых маршрутов:** Убедись, что все определенные маршруты используются в приложении.
        4.  **Проверь наличие валидации для входных данных (если применимо):**  Убедись, что в контроллерах присутствует валидация для входных данных.
        5.  **Проверь наличие авторизации (если применимо):** Убедитесь, что контроллеры защищены механизмами авторизации (middleware, policies).

        **Примеры:**

        *   `Route::get('/posts/{id}', [PostController::class, 'show']);`  - Проверь существование `PostController` и метода `show`. Убедись, что метод принимает параметр `$id`.
        *   `Route::post('/posts', [PostController::class, 'store']);` - Проверь существование `PostController` и метода `store`. Убедись, что метод принимает необходимые данные для создания записи.

chat:
  auto_reply: true
